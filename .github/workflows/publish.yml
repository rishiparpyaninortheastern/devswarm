name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (must match pyproject.toml)'
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify requested release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as source:
              version = tomllib.load(source)['project']['version']
          assert os.environ['RELEASE_VERSION'] == version, 'Version does not match pyproject.toml'
          PY
      - run: python -m pip install -c requirements.lock.txt -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify clean base-package installation
        run: |
          python -m venv .data/release-env
          .data/release-env/bin/python -m pip install dist/*.whl
          python scripts/installed_package_smoke.py --python .data/release-env/bin/python
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/swarmsleuth/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
