[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devswarm"
version = "0.1.0"
description = "Local-first, evidence-backed incident triage with an Azure-oriented architecture"
readme = "PACKAGE_README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["incident", "triage", "azure", "mcp", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pydantic>=2.10,<3"]

[project.urls]
Repository = "https://github.com/rishiparpyaninortheastern/devswarm"
Issues = "https://github.com/rishiparpyaninortheastern/devswarm/issues"
Documentation = "https://github.com/rishiparpyaninortheastern/devswarm/blob/main/PACKAGE_README.md"

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
azure = ["azure-functions>=1.21,<2"]
mcp = ["fastmcp>=2.12,<4"]
all = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "azure-functions>=1.21,<2", "fastmcp>=2.12,<4"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "build>=1.2,<2", "twine>=6,<8", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "azure-functions>=1.21,<2", "fastmcp>=2.12,<4"]

[project.scripts]
devswarm = "devswarm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["devswarm*"]

[tool.setuptools.package-data]
"devswarm.resources" = ["*.json", "*.tf", "*.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
